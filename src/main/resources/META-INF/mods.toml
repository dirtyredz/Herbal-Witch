modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="herbalwitch-logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="MATCH_VERSION"

[[dependencies.${mod_id}]]
    modId="guideme"
    mandatory=true
    versionRange="[${guideme_version}]"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
