// Forge resolves launch tokens inside MinecraftRunTask.exec(), not in JavaExec's getters.
// Use that same task type with an isolated copy of the fully merged dedicated run configuration.
def familiarConfigType = minecraft.runs.gameTestServer.class
def familiarTaskType = familiarConfigType.classLoader.loadClass('net.minecraftforge.gradle.common.util.runs.MinecraftRunTask')
def familiarRun = file("run/familiar-restart/${UUID.randomUUID()}")
def familiarEvidence = new File(familiarRun, 'evidence')
tasks.named('processGameTestResources').configure {
    from('src/gameTest/resources/data/herbalwitch/structures/empty.nbt') { into 'data/herbalwitch_restart/structures' }
}
['Prepare', 'Verify'].each { phase ->
    tasks.register("runFamiliarRestart${phase}", familiarTaskType) {
        group = 'verification'
        dependsOn { def base = tasks.named('runGameTestServer').get(); base.taskDependencies.getDependencies(base) }
        if (phase == 'Verify') dependsOn 'runFamiliarRestartPrepare'
        runConfig.set(providers.provider {
            def base = tasks.named('runGameTestServer', JavaExec).get()
            def config = familiarConfigType.getConstructor(Project, String).newInstance(project, "familiarRestart${phase}".toString())
            config.merge(base.runConfig.get(), true)
            if (config.client || !config.args.contains('forgegametestserveruserdev') || !config.main) {
                throw new GradleException('Restart harness requires the resolved dedicated GameTest launch target')
            }
            config.workingDirectory(familiarRun)
            config.property('forge.enabledGameTestNamespaces', 'herbalwitch_restart')
            config.property('herbalwitch.restart.phase', phase.toLowerCase(Locale.ROOT))
            config.property('herbalwitch.restart.evidence', familiarEvidence.absolutePath)
            config
        })
        mainClass.set(runConfig.map { it.main })
        classpath = files(providers.provider { tasks.named('runGameTestServer').get().classpath })
        minecraftArtifacts.from(providers.provider { tasks.named('runGameTestServer').get().minecraftArtifacts })
        runtimeClasspathArtifacts.from(providers.provider { tasks.named('runGameTestServer').get().runtimeClasspathArtifacts })
        additionalClientArgs.set([])
    }
}
tasks.register('familiarRestartTest', Exec) {
    group = 'verification'
    description = 'ANU only: two dedicated JVMs qualify actual familiar checkpoints.'
    dependsOn 'runFamiliarRestartVerify'
    commandLine (project.findProperty('nodeExecutable') ?: 'node').toString(),
            'tools/familiars/restart/verify-report.mjs', familiarEvidence.absolutePath
}
