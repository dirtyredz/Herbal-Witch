// Two independent server JVMs share only copied checkpoint evidence and their isolated test world.
// Never wired into check/build: this is the named ANU-only heavier qualification.
def familiarRun = file("run/familiar-restart/${UUID.randomUUID()}")
def familiarEvidence = new File(familiarRun, 'evidence')
minecraft.runs {
    familiarRestartPrepare {
        taskName 'runFamiliarRestartPrepare'
        parent minecraft.runs.gameTestServer
        client false
        property 'forge.gameTestServer', 'true'
        workingDirectory familiarRun
        property 'forge.enabledGameTestNamespaces', 'herbalwitch_restart'
        property 'herbalwitch.restart.phase', 'prepare'
        property 'herbalwitch.restart.evidence', familiarEvidence.absolutePath
    }
    familiarRestartVerify {
        taskName 'runFamiliarRestartVerify'
        parent minecraft.runs.gameTestServer
        client false
        property 'forge.gameTestServer', 'true'
        workingDirectory familiarRun
        property 'forge.enabledGameTestNamespaces', 'herbalwitch_restart'
        property 'herbalwitch.restart.phase', 'verify'
        property 'herbalwitch.restart.evidence', familiarEvidence.absolutePath
    }
}
tasks.named('processGameTestResources').configure {
    from('src/gameTest/resources/data/herbalwitch/structures/empty.nbt') {
        into 'data/herbalwitch_restart/structures'
    }
}
// Configure after Forge has created the run tasks. dependsOn prevents overlap even with --parallel.
tasks.configureEach { if (name == 'runFamiliarRestartVerify') dependsOn 'runFamiliarRestartPrepare' }
afterEvaluate {
    tasks.register('familiarRestartTest', Exec) {
        group = 'verification'
        description = 'ANU only: capture actual checkpoints, restart in a second JVM, qualify admission and inventory.'
        dependsOn 'runFamiliarRestartVerify'
        commandLine (project.findProperty('nodeExecutable') ?: 'node').toString(),
                'tools/familiars/restart/verify-report.mjs', familiarEvidence.absolutePath
    }
}
