// Forge resolves launch tokens inside MinecraftRunTask.exec(), not in JavaExec's getters.
// Use that same task type with an isolated copy of the fully merged dedicated run configuration.
def magicToolsConfigType = minecraft.runs.gameTestServer.class
def magicToolsTaskType = magicToolsConfigType.classLoader.loadClass('net.minecraftforge.gradle.common.util.runs.MinecraftRunTask')
def magicToolsRun = file("run/magicTools-restart/${UUID.randomUUID()}")
def magicToolsEvidence = new File(magicToolsRun, 'evidence')
tasks.named('processGameTestResources').configure {
    from('src/gameTest/resources/data/herbalwitch/structures/empty.nbt') { into 'data/herbalwitch_tools_restart/structures' }
}
['Prepare', 'Verify'].each { phase ->
    tasks.register("runMagicToolsRestart${phase}", magicToolsTaskType) {
        group = 'verification'
        dependsOn { def base = tasks.named('runGameTestServer').get(); base.taskDependencies.getDependencies(base) }
        if (phase == 'Verify') dependsOn 'runMagicToolsRestartPrepare'
        runConfig.set(providers.provider {
            def base = tasks.named('runGameTestServer', JavaExec).get()
            def config = magicToolsConfigType.getConstructor(Project, String).newInstance(project, "magicToolsRestart${phase}".toString())
            config.merge(base.runConfig.get(), true)
            // RunConfig.merge deliberately omits token maps, including the JPMS module path.
            config.setTokens(base.runConfig.get().tokens)
            config.setLazyTokens(base.runConfig.get().lazyTokens)
            if (config.client || !config.args.contains('forgegametestserveruserdev') || !config.main) {
                throw new GradleException('Restart harness requires the resolved dedicated GameTest launch target')
            }
            config.workingDirectory(magicToolsRun)
            config.property('forge.enabledGameTestNamespaces', 'herbalwitch_tools_restart')
            config.property('herbalwitch.tools.restart.phase', phase.toLowerCase(Locale.ROOT))
            config.property('herbalwitch.tools.restart.evidence', magicToolsEvidence.absolutePath)
            config
        })
        mainClass.set(runConfig.map { it.main })
        classpath = files(providers.provider { tasks.named('runGameTestServer').get().classpath })
        minecraftArtifacts.from(providers.provider { tasks.named('runGameTestServer').get().minecraftArtifacts })
        runtimeClasspathArtifacts.from(providers.provider { tasks.named('runGameTestServer').get().runtimeClasspathArtifacts })
        additionalClientArgs.set([])
    }
}
tasks.register('magicToolsRestartTest', Exec) {
    group = 'verification'
    description = 'ANU only: two dedicated JVMs qualify physical broom, packed tools and interrupted repair persistence.'
    dependsOn 'runMagicToolsRestartVerify'
    commandLine (project.findProperty('nodeExecutable') ?: 'node').toString(),
            'tools/test/magic-tools-restart-report.mjs', magicToolsEvidence.absolutePath
}
