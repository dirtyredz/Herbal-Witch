plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Optional-mod runtime profile for headless adapter checks (docs/COMPATIBILITY.md):
//   -PcompatProfile=base|emi|jei|viewers|farmersdelight|thirst|curios|doggy|all   (default base: no optional mods)
// Farmer's Delight and Thirst Was Taken come from a local mods folder: -PcompatModsDir=<folder>.
// Optional isolated qualification world; preserve the ordinary retained test world by default.
def gameTestRunId = project.findProperty('gameTestRunId')?.toString()
if (gameTestRunId && !(gameTestRunId ==~ /[a-z0-9_-]{1,64}/)) throw new GradleException('Invalid gameTestRunId')
def compatProfile = (project.findProperty('compatProfile') ?: 'base').toString()
if (!(compatProfile in ['base', 'emi', 'jei', 'viewers', 'farmersdelight', 'thirst', 'curios', 'doggy', 'all'])) {
    throw new GradleException("Unknown compatProfile '${compatProfile}'")
}
def needsLocalMods = compatProfile in ['farmersdelight', 'thirst', 'doggy', 'all']
def compatModsDir = project.findProperty('compatModsDir')?.toString()
if (needsLocalMods && !compatModsDir) {
    throw new GradleException("compatProfile '${compatProfile}' needs -PcompatModsDir=<folder holding its optional runtime jars>")
}

// Generated assets and data are checked in and packaged; the datagen cache is not.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache/'
        }
    }
    // GameTests live in their own source set so they never reach the release jar.
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            if (needsLocalMods) {
                // The local mod jars ship SRG refmaps; remap them for the dev environment.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
        }

        // Headless: a dedicated server that runs every GameTest in the herbalwitch namespace, then exits.
        gameTestServer {
            workingDirectory project.file(gameTestRunId ? "run/gametest-${gameTestRunId}" : 'run/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        // Headless datagen: writes src/generated/resources, reading authored assets from src/main/resources.
        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    // Recipe viewer APIs (compile-only; the jar ships no viewer classes).
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    // Curios API (compile-only; the jar ships no Curios classes).
    maven { url = 'https://maven.theillusivec4.top/' }
    if (compatModsDir) {
        flatDir { dirs compatModsDir }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    // -PcompatProfile=<base|emi|jei|viewers|farmersdelight|thirst|all> puts optional mods on the
    // dev runtime (runGameTestServer, runServer) to test the adapters. Never part of a normal build.
    if (compatProfile in ['jei', 'viewers', 'all']) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    if (compatProfile in ['emi', 'viewers', 'all']) {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }
    if (compatProfile in ['curios', 'all']) {
        // Reuse an owner-supplied runtime jar for fully offline qualification when available.
        runtimeOnly fg.deobf("${compatModsDir ? 'local' : 'top.theillusivec4.curios'}:curios-forge:${curios_version}")
    }
    if (compatProfile in ['farmersdelight', 'all']) {
        runtimeOnly fg.deobf("local:FarmersDelight-${minecraft_version}:${farmersdelight_version}")
    }
    if (compatProfile in ['thirst', 'all']) {
        runtimeOnly fg.deobf("local:ThirstWasTaken-${minecraft_version}:${thirst_version}")
    }
    if (compatProfile == 'doggy') {
        runtimeOnly fg.deobf("local:DoggyTalentsNext-${minecraft_version}:${doggytalents_version}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // The resource tests read the checked-in generated and authored trees relative to the project.
    workingDir = projectDir
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

apply from: 'gradle/art.gradle'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/qualification.gradle'
